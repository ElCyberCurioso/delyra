# F8-11 · Publicación de la app de Android. Solo se lanza a mano, desde main: Actions →
# «Android release» → Run workflow, con la versión (X.Y.Z).
# - Firma el AAB con la clave de subida, que vive en los secretos del Environment `android-release`
#   (nunca en el repositorio). Google Play lo vuelve a firmar con la clave de la app (Play App
#   Signing), que es la que ven los móviles.
# - Deja como artefacto el AAB y el mapping de R8 (para leer los fallos en Play Console). La subida
#   a Google Play es manual (ADR-0016, docs/runbooks/android.md).
# - Exige CI en verde para el commit, como el despliegue. Sin caché de Gradle: lo que se firma se
#   compila desde cero.
name: Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión (X.Y.Z, con Y y Z menores que 100)"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  bundle:
    name: AAB firmado
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: android-release
    steps:
      - name: Comprobar la versión y la rama
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error title=Rama no válida::Se publica desde main (se lanzó desde ${GITHUB_REF})."
            exit 1
          fi
          if ! [[ "${VERSION}" =~ ^[0-9]{1,3}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]; then
            echo "::error title=Versión no válida::«${VERSION}» no es X.Y.Z (Y y Z menores que 100)."
            exit 1
          fi

      - name: Exigir CI en verde para este commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          conclusion=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "sin ejecución"')
          echo "CI para ${SHA}: ${conclusion}"
          if [ "${conclusion}" != "success" ]; then
            echo "::error title=CI no está en verde::El último CI de ${SHA} terminó en «${conclusion}». Publica un commit con CI en verde."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      # Verifica el checksum del wrapper; sin caché para no firmar nada que venga de otra ejecución.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Preparar la clave de subida
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error title=Falta la clave::Falta el secreto ANDROID_UPLOAD_KEYSTORE_BASE64 en el Environment android-release."
            exit 1
          fi
          umask 077
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/upload.jks"

      - name: Construir el AAB con R8 y firmarlo
        working-directory: apps/android
        env:
          DELYRA_UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          DELYRA_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          DELYRA_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          DELYRA_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          VERSION: ${{ inputs.version }}
        run: ./gradlew --no-configuration-cache --no-build-cache bundleRelease "-Pdelyra.versionName=${VERSION}"

      - name: Comprobar la firma
        working-directory: apps/android
        run: |
          aab=app/build/outputs/bundle/release/app-release.aab
          if ! jarsigner -verify "${aab}" | grep -q "jar verified."; then
            echo "::error title=AAB sin firmar::${aab} no tiene una firma válida."
            exit 1
          fi
          # La huella de la clave de subida es pública: Play Console la enseña al subir el AAB.
          keytool -printcert -jarfile "${aab}" | grep -m1 "SHA256:"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delyra-android-${{ inputs.version }}
          path: |
            apps/android/app/build/outputs/bundle/release/app-release.aab
            apps/android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Borrar la clave de subida
        if: always()
        run: rm -f "${RUNNER_TEMP}/upload.jks"
