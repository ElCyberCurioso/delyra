# F0-10 · Despliegue a producción. No hay staging (ADR-0003).
# - Automático: cada push a main se despliega en cuanto su CI termina en verde (`workflow_run`).
#   Solo se despliega el último commit de main: si mientras tanto llegó otro, este se salta y el
#   nuevo, que lo incluye, se despliega con su propio CI. Un CI en rojo no despliega nada.
# - También se puede lanzar a mano para volver a desplegar (Actions → Deploy → Run workflow, o
#   `gh workflow run deploy.yml`); exige igualmente CI en verde para ese commit.
# - Grupo de concurrencia propio y sin cancelar: un push nuevo nunca corta un despliegue a medias
#   (el CI de main sí se cancela al llegar otro push, y entonces ese commit no se despliega).
# - Sin revisores obligatorios en el Environment `production`: bloquearían el automático.
# - Empieza con scripts/check-deploy-config.mjs, que falla con un mensaje claro si falta algo.
# - Orden: migraciones → api → SPA (las SPA enlazan el api por Service Binding). Las migraciones
#   deben ser compatibles con la versión anterior del código (expand/contract).
# - Termina con los e2e de humo (@smoke, solo lectura) contra producción. Si fallan, revierte con
#   `wrangler rollback` (docs/runbooks/despliegue.md).
# - `pnpm ci:status` enseña desde la terminal cómo van el CI y el despliegue de un commit.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  decide:
    name: Qué se despliega
    # Solo el CI de un push a main de este repositorio (nunca el de un PR, aunque su rama se
    # llame main) y en verde. A mano, siempre.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.decide.outputs.sha }}
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - name: ¿Sigue siendo el último commit de main?
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            echo "sha=${DISPATCH_SHA}" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head=$(gh api "repos/${REPO}/commits/main" --jq .sha)
          echo "sha=${CI_SHA}" >> "$GITHUB_OUTPUT"
          if [ "${head}" = "${CI_SHA}" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Despliegue saltado::main ya está en ${head}; se desplegará con su propio CI (incluye ${CI_SHA})."
          fi

  production:
    name: Producción
    needs: decide
    if: needs.decide.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.preflight.outputs.calendar_url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.sha }}
          persist-credentials: false

      # A mano justo después de un push, el CI de este commit puede seguir en marcha: se espera a
      # que termine (hasta 20 min, o 2 min si todavía no ha aparecido ninguna ejecución). En el
      # automático ya ha terminado en verde y el paso pasa a la primera.
      - name: Exigir CI en verde para este commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.decide.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          start=$SECONDS
          while :; do
            status=""
            conclusion=""
            # Un fallo puntual de la API deja el estado vacío y se reintenta en la siguiente vuelta.
            read -r status conclusion < <(gh api \
              "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&per_page=1" \
              --jq '(.workflow_runs[0] // {status: "ninguna"}) | "\(.status) \(.conclusion // "-")"') || true
            waited=$((SECONDS - start))
            if [ "${status}" = "completed" ]; then
              echo "CI para ${SHA}: ${conclusion}"
              if [ "${conclusion}" = "success" ]; then break; fi
              echo "::error title=CI no está en verde::El CI de ${SHA} terminó en «${conclusion}». Despliega un commit con CI en verde."
              exit 1
            fi
            if [ "${status}" = "ninguna" ] && [ "${waited}" -ge 120 ]; then
              echo "::error title=Sin CI::No hay ninguna ejecución de CI (push) para ${SHA}. Despliega un commit de main con CI en verde."
              exit 1
            fi
            if [ "${waited}" -ge 1200 ]; then
              echo "::error title=CI sin terminar::El CI de ${SHA} sigue «${status:-desconocido}» tras 20 min. Vuelve a lanzar el despliegue cuando termine."
              exit 1
            fi
            echo "CI para ${SHA}: ${status:-desconocido}; se vuelve a mirar en 30 s (${waited} s esperando)"
            sleep 30
          done

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Comprobar configuración de despliegue
        id: preflight
        run: node scripts/check-deploy-config.mjs

      - name: Migraciones D1
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: apps/api
          command: d1 migrations apply DB --env production --remote

      - name: Desplegar api
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: apps/api
          command: deploy --env production

      - name: Build de las SPA
        env:
          CLOUDFLARE_ENV: production
        run: |
          pnpm --filter @delyra/calendar build
          pnpm --filter @delyra/work build

      - name: Desplegar calendar
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: apps/calendar
          command: deploy

      - name: Desplegar work
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: apps/work
          command: deploy

      - run: pnpm exec playwright install --with-deps chromium
      - name: E2E de humo contra producción
        env:
          E2E_CALENDAR_URL: ${{ steps.preflight.outputs.calendar_url }}
          E2E_WORK_URL: ${{ steps.preflight.outputs.work_url }}
        run: pnpm e2e --grep @smoke
