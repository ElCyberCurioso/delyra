<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "PJS";
        src: url("pjs.woff2") format("woff2");
        font-weight: 200 800;
        unicode-range: U+0000-00FF;
      }
      @font-face {
        font-family: "PJS";
        src: url("pjs-ext.woff2") format("woff2");
        font-weight: 200 800;
        unicode-range: U+0100-024F;
      }
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 500px;
        overflow: hidden;
      }
      body {
        font-family: "PJS", sans-serif;
        position: relative;
        background:
          radial-gradient(
            circle at 88% 8%,
            rgba(196, 232, 107, 0.35) 0,
            rgba(196, 232, 107, 0) 38%
          ),
          radial-gradient(circle at 8% 110%, rgba(0, 161, 102, 0.55) 0, rgba(0, 161, 102, 0) 45%),
          linear-gradient(135deg, #00a166 0%, #007145 52%, #00553a 100%);
        color: #fff;
      }
      .copy {
        position: absolute;
        left: 72px;
        top: 0;
        bottom: 0;
        width: 520px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
      }
      .logo {
        width: 76px;
        height: 76px;
        border-radius: 20px;
        background: #fff;
        display: grid;
        place-items: center;
        box-shadow: 0 10px 30px rgba(0, 40, 25, 0.35);
      }
      .logo svg {
        width: 44px;
        height: 44px;
      }
      .name {
        font-size: 64px;
        font-weight: 800;
        letter-spacing: -1.5px;
      }
      .tagline {
        margin-top: 26px;
        font-size: 34px;
        line-height: 1.2;
        font-weight: 700;
        letter-spacing: -0.5px;
      }
      .sub {
        margin-top: 16px;
        font-size: 18px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.82);
      }
      .phone {
        position: absolute;
        left: 690px;
        top: 58px;
        width: 252px;
        height: 448px;
        border-radius: 34px;
        background: #0e1c14;
        padding: 9px;
        box-shadow: 0 30px 60px rgba(0, 30, 18, 0.55);
        transform: rotate(-5deg);
      }
      .phone img {
        width: 252px;
        height: 448px;
        border-radius: 26px;
        display: block;
        object-fit: cover;
        object-position: top;
      }
      .card {
        position: absolute;
        left: 618px;
        top: 318px;
        width: 330px;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 18px 40px rgba(0, 30, 18, 0.45);
        transform: rotate(3deg);
      }
      .card img {
        width: 330px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 32 32">
            <path
              d="M10 8h6.5a8 8 0 0 1 0 16H10z"
              fill="none"
              stroke="#007145"
              stroke-width="3.4"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <div class="name">Delyra</div>
      </div>
      <div class="tagline" id="tagline"></div>
      <div class="sub" id="sub"></div>
    </div>
    <div class="phone"><img src="shot-calendar.png" alt="" /></div>
    <div class="card"><img src="shot-card.png" alt="" /></div>
    <script>
      const en = location.search.includes("lang=en");
      document.getElementById("tagline").textContent = en
        ? "Your calendar and your tasks, in one account."
        : "Tu calendario y tus tareas, en una sola cuenta.";
      document.getElementById("sub").textContent = en
        ? "Calendar · Kanban boards · Alerts · Offline"
        : "Calendario · Tableros kanban · Alertas · Sin conexión";
    </script>
  </body>
</html>
